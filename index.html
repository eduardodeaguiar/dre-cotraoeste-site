<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRE Gerencial · Cotraoeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F9; --surface:#FFFFFF; --border:#E4E9EE; --border-light:#F0F2F5;
  --green:#1A9E39; --green-dark:#12772A; --green-light:#E3F5E8;
  --media-bg:#F0FAF2; --media-cab:#1A9E39;
  --dark:#191E25; --dark-soft:#2A3040;
  --text-primary:#1A1F2B; --text-secondary:#4A5568; --text-muted:#8896A6; --text-light:#B0BBC8;
  --blue:#3B82C4; --blue-light:#EBF3FC; --amber:#C89020; --red:#C0392B;
  --n1:#292929; --n2:#4D4D4D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);
  font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
.oculto{display:none!important}

/* ---------- topo ---------- */
header{background:var(--dark);color:#fff;padding:14px 22px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.2px;
  color:#C9D3DE;padding-left:14px;border-left:1px solid rgba(255,255,255,.18)}
/* A logo e verde sobre claro; num cabecalho escuro o subtitulo cinza some.
   A pastilha branca preserva a marca em vez de recolorir. */
header .marca{height:30px;background:#fff;border-radius:6px;padding:4px 9px;
  display:block}
/* Igual ao rodape da sidebar do BI Frotas: faixa escura #15151a, rotulo em
   caixa alta espacada e o logo BRANCO sem filtro nenhum. Antes eu recolorizava
   o PNG branco com invert() sobre fundo claro -- virava cinza barrento. */
.rodape{background:#15151a;margin-top:34px;padding:22px 0 26px;
  text-align:center;color:#6b6b75;font-size:10px;text-transform:uppercase;
  letter-spacing:1.5px;font-weight:700;line-height:1.9}
.rodape img{display:block;margin:3px auto 0;width:150px;max-width:62%;
  opacity:.92}
/* ---------- simulador ---------- */
.sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:14px;align-items:start}
.sim-cx{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px}
.sim-cx.destaque{border-color:var(--green);box-shadow:0 0 0 1px var(--green-muted)}
.sim-cx h3{margin:0 0 2px;font-size:14px}
.sim-cx .sub{font-size:12px;color:var(--text-muted);margin-bottom:12px}
table.sim{width:100%;border-collapse:collapse;font-size:13px}
table.sim td{padding:5px 0;border-bottom:1px solid var(--border-light)}
table.sim td.num{text-align:right;font-variant-numeric:tabular-nums;width:130px}
table.sim.dois td.num{width:150px}
table.sim tr.cab td{border-bottom:2px solid var(--dark);padding-bottom:6px}
table.sim select{padding:3px 7px;font-size:13px;border:1px solid var(--border);border-radius:5px}
table.sim tr.sub-t td{border-top:1px solid var(--border);font-weight:500}
table.sim tr.tot td{border-top:2px solid var(--dark);border-bottom:0;
  padding-top:8px;font-weight:700;font-size:14px}
table.sim tr.tot.grande td{font-size:17px;color:var(--green-dark)}
table.sim tr.tot.bom td{color:var(--green-dark)}
table.sim input{width:118px;text-align:right;padding:3px 7px;font-size:13px;
  border:1px solid var(--border);border-radius:5px;
  font-variant-numeric:tabular-nums}
table.sim input:focus{outline:2px solid var(--green);outline-offset:-1px}
.sim-nota{font-size:12px;color:var(--text-secondary);margin-top:12px;
  padding-top:10px;border-top:1px solid var(--border-light)}
.aj{display:inline-block;width:14px;height:14px;line-height:14px;text-align:center;
  border-radius:50%;background:var(--border);color:var(--text-muted);
  font-size:10px;margin-left:5px;cursor:help}

/* ---------- cartoes / avisos ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:13px 15px}
.card .rot{font-size:11px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.4px}
.card .val{font-size:20px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.aviso{background:#FFF8E8;border:1px solid #F0DCAE;color:#7A5A12;border-radius:8px;
  padding:11px 14px;margin-bottom:14px;font-size:13px}
.aviso b{color:#5C440D}
.vazio{padding:40px;text-align:center;color:var(--text-muted)}

/* ---------- login ---------- */
#login{position:fixed;inset:0;background:var(--dark);display:flex;
  align-items:center;justify-content:center;z-index:100}
#login .cx{background:var(--surface);padding:30px;border-radius:12px;width:330px}
#login h2{margin:0 0 4px;font-size:17px}
#login p{margin:0 0 18px;font-size:12.5px;color:var(--text-muted)}
#login input{width:100%;margin-bottom:10px}
#login .btn{width:100%}
#login .erro{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(25,30,37,.55);display:flex;
  align-items:center;justify-content:center;z-index:90}
#modal .cx{background:var(--surface);padding:22px;border-radius:12px;width:420px;
  max-width:92vw}
#modal h3{margin:0 0 3px;font-size:15px}
#modal .sub{font-size:12px;color:var(--text-muted);margin-bottom:14px}
#modal label{display:block;font-size:12px;color:var(--text-secondary);
  margin:10px 0 4px}
#modal input,#modal textarea{width:100%}
#modal textarea{min-height:64px;resize:vertical}
#modal .acoes{display:flex;gap:8px;margin-top:16px}
#modal .acoes .btn{flex:1}
#t-notas{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  overflow:hidden}
#t-notas thead th{background:var(--dark);color:#fff;font-size:11px;font-weight:500;
  text-transform:uppercase;letter-spacing:.4px;padding:9px 12px;text-align:left}
#t-notas th.num,#t-notas td.num{text-align:right}
#t-notas tbody td{padding:8px 12px;border-bottom:1px solid var(--border-light);
  vertical-align:top;font-variant-numeric:tabular-nums}
#t-notas tbody tr:last-child td{border-bottom:0}
#t-notas tbody tr:hover td{background:#FAFCFE}
#t-notas tr.edicao td.forte{color:var(--blue);font-weight:600}
#t-notas tr.nota td.num{color:var(--text-light)}
#t-notas .dom{color:var(--text-light);font-size:11px}
#t-notas .dif{display:block;font-size:11px;color:var(--green-dark);margin-top:2px}
#t-notas .dif.neg{color:var(--red)}
#t-notas td.com{color:var(--text-secondary);max-width:420px;white-space:normal}
#t-notas tr.edicao td:first-child::before{content:"✎ ";color:var(--blue)}
#t-notas tr.nota td:first-child::before{content:"● ";color:var(--amber)}
#t-notas a{color:var(--text-muted);font-size:12px;text-decoration:none}
#t-notas a:hover{color:var(--red)}
.lista{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.lista .it{padding:12px 15px;border-bottom:1px solid var(--border-light)}
.lista .it:last-child{border-bottom:0}
.lista .cab{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lista .assunto{font-weight:600;font-size:13px}
.lista .meta{font-size:11.5px;color:var(--text-muted);margin-left:auto}
.lista .txt{font-size:13px;color:var(--text-secondary);margin-top:5px;
  white-space:pre-wrap}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
  background:var(--green-light);color:var(--green-dark);font-weight:500}
.tag.fora{background:#FDEBE9;color:var(--red)}
.tag.sem{background:#FFF3DC;color:var(--amber)}
</style>
</head>

  <div class="cx">

    <p>Cotraoeste Logística S.A.</p>
    <input id="lg-email" type="email" placeholder="e-mail" autocomplete="username">
    <input id="lg-senha" type="password" placeholder="senha" autocomplete="current-password">
    <button class="btn" id="lg-entrar">Entrar</button>
    <div class="erro" id="lg-erro"></div>
  </div>
</div>

<script>
/* ===================== configuração ===================== */
const CONFIG = {

  NOME    : "Cotraoeste Logística S.A."
};

/* ===================== estado ===================== */
const S = {
  sessao:null, admin:false,
  estrutura:[], fato:{}, edicoes:{}, notas:[], contas:[], carga:null,
  meses:[], de:null, ate:null, colapsados:new Set(), abertos:new Set(),

};

const fmt = n => (n===null||n===undefined||isNaN(n)) ? "" :
  n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const rotMes = m => { const [a,b]=m.split("-"); return b+"/"+a.slice(2); };

/* ===================== Supabase por REST puro ===================== */
async function sb(caminho, opc={}){

/* ===================== carga ===================== */
async function carregar(){

  const [est, fat, edi, not, con, car] = await Promise.all([
    sb("dre_estrutura?"+p+"&select=*&order=linha"),

  ]);

  S.fato = {};
  for(const f of fat){ (S.fato[f.mes] = S.fato[f.mes]||{})[f.chave] = +f.valor; }
  S.edicoes = {};

  S.notas = not; S.contas = con; S.carga = car?.[0] || null;
  S.meses = [...new Set(fat.map(f=>f.mes))].sort();
  S.de = S.de || S.meses[0];
  S.ate = S.ate || S.meses[S.meses.length-1];
}

/* ===================== motor de cálculo =====================
   Resolve por dependência, não por ordem da planilha. As edições manuais
   entram ANTES dos totais: senão o ajuste aparece na linha e não chega ao
   EBITDA, que foi exatamente o bug do dre-gerencial anterior.            */
function calcular(mes, ignorar){
  const porLinha = {}; S.estrutura.forEach(i=>porLinha[i.linha]=i);
  const fm = S.fato[mes] || {}, val = {}, andando = new Set();

  function v(ln){
    if(ln in val) return val[ln];
    const it = porLinha[ln]; if(!it) return 0;
    if(andando.has(ln)) return 0;
    andando.add(ln);
    let r = null;
    const ed = (ln === ignorar) ? null : S.edicoes[ln+"|"+mes];
    if(ed){ r = +ed.valor; }                       // edição manda em tudo
    else {
      const c = it.config || {};
      if(it.tipo==="manual")      r = +(c.valor||0);
      else if(it.tipo==="fonte" || it.tipo==="info"){   // 'info' soma igual,
                                                        // so nao entra em total

        r = (c.fontes||[]).reduce((s,f)=> s + f.sinal*(fm[f.chave]||0), 0);
        r += (c.mais_linhas||[]).reduce((s,x)=> s + v(x), 0);
      }
      else if(it.tipo==="grupo")  r = (c.parcelas||[]).reduce((s,x)=> s + v(x), 0);
      else if(it.tipo==="regra")  r = avaliar(c.expr, v);
    }
    andando.delete(ln);
    val[ln] = r;
    return r || 0;
  }
  S.estrutura.forEach(i=>v(i.linha));
  return val;
}

function avaliar(expr, v){
  if(!expr) return null;
  let e = String(expr).replace(/^=/,"").replace(/\s/g,"");
  if(/IFERROR|![A-Z]|#REF/.test(e)) return null;     // fórmula que não migrou
  // SUM(C79,C81) -> (C79+C81) e SUM(C46:C56) -> (C46+C47+...). Trocar so o
  // "SUM(" por "(" deixava uma lista, e em JS o operador virgula devolve
  // apenas o ultimo termo -- FERIAS ADM. e DECIMO TERCEIRO saiam errados.
  e = e.replace(/SUM\(([^()]*)\)/g, (m,dentro)=>{
    const partes=[];
    dentro.split(",").forEach(p=>{
      const f=p.trim().match(/^C(\d+):C(\d+)$/);
      if(f){ for(let i=+f[1]; i<=+f[2]; i++) partes.push("C"+i); }
      else partes.push(p.trim());
    });
    return "("+partes.join("+")+")";
  });
  e = e.replace(/([\d.]+)%/g, (m,n)=>"("+(parseFloat(n)/100)+")");
  e = e.replace(/[A-Z]{1,2}(\d+)/g, (m,n)=>"("+v(+n)+")");
  if(/[^0-9.+\-*/() ]/.test(e)) return null;
  try { return Function('"use strict";return ('+e+')')(); } catch(_){ return null; }
}

/* ===================== DRE ===================== */
const TRI = {1:"1T",2:"2T",3:"3T",4:"4T"}, SEM = {1:"1S",2:"2S"};
const FECHA = {Trimestral:3, Semestral:6, Anual:12};
const LINHA_BASE = 4;           // AV é sobre a Receita Operacional Bruta (C$4)

/* Os blocos cuja AH vale em PONTOS da receita, não em reais: variam junto com o
   faturamento por natureza. Custo fixo e despesa administrativa ficam no
   nominal — ali o valor não deveria acompanhar a receita, e crescer em reais já
   é a notícia. */
const BLOCOS_PP = ["DEDUÇÕES DA RECEITA BRUTA", "CUSTO VARIÁVEL"];

function mesesVisiveis(){
  const i = S.meses.indexOf(S.de), j = S.meses.indexOf(S.ate);
  return S.meses.slice(Math.min(i,j), Math.max(i,j)+1);
}
const chaveGrupo = {
  Trimestre: m => m.slice(0,4)+"-T"+(Math.floor((+m.slice(5,7)-1)/3)+1),
  Semestre : m => m.slice(0,4)+"-S"+(+m.slice(5,7)<=6?1:2),
  Ano      : m => m.slice(0,4),
  // o grupo de Media usa os mesmos cortes, com os nomes do proprio grupo
  Trimestral: m => m.slice(0,4)+"-T"+(Math.floor((+m.slice(5,7)-1)/3)+1),
  Semestral : m => m.slice(0,4)+"-S"+(+m.slice(5,7)<=6?1:2),
  Anual     : m => m.slice(0,4),
};
function rotGrupo(k){
  if(k.includes("-T")) return TRI[+k.slice(-1)]+" "+k.slice(2,4);
  if(k.includes("-S")) return SEM[+k.slice(-1)]+" "+k.slice(2,4);
  return k;
}

/* A sequência de colunas. `periodo` é a granularidade do valor; `media`
   acrescenta, depois do último período de cada grupo, a média MENSAL dele.
   Grupo fechado leva o nome ("Média 1T 26"); o último, ainda aberto, leva o
   número de meses — senão uma média de dois meses fica idêntica a uma de três
   e a diferença só aparece quando alguém compara e não entende. */
function montarColunas(ms){
  const hoje = new Date();
  const corrente = hoje.getFullYear()+"-"+String(hoje.getMonth()+1).padStart(2,"0");
  let base;
  if(S.periodo==="Mês"){
    base = ms.map(m=>({tipo:"mes", meses:[m], rotulo:rotMes(m)}));
  } else {
    const g = {}; ms.forEach(m=>{ const k=chaveGrupo[S.periodo](m); (g[k]=g[k]||[]).push(m); });
    base = Object.entries(g).map(([k,mm])=>({tipo:"agregado", meses:mm, rotulo:rotGrupo(k)}));
  }
  if(S.media==="Nenhuma" || !base.length) return base;

  const kf = chaveGrupo[S.media];
  if(typeof kf !== "function") return base;   // media desconhecida: sem coluna extra
  const grupos = {};
  ms.forEach(m=>{ const k=kf(m); (grupos[k]=grupos[k]||[]).push(m); });
  const chaves = Object.keys(grupos).sort();
  const ultimo = chaves[chaves.length-1];
  const depois = {};
  for(const k of chaves){
    let iMax = -1;
    base.forEach((c,i)=>{ if(c.meses.some(m=>grupos[k].includes(m))) iMax=i; });
    if(iMax>=0) (depois[iMax]=depois[iMax]||[]).push(k);
  }
  const cols = [];
  base.forEach((c,i)=>{
    cols.push(c);
    for(const k of (depois[i]||[])){
      // a média só conta mês fechado: o corrente entra pela metade e puxa o
      // número para baixo sem avisar ninguém.
      const fechados = grupos[k].filter(m=>m < corrente);
      if(!fechados.length) continue;
      const completo = grupos[k].length===FECHA[S.media] && fechados.length===FECHA[S.media];
      let rot;
      if(completo) rot = "Média "+rotGrupo(k);
      else if(k===ultimo) rot = "Média "+fechados.length+(fechados.length>1?" meses":" mês");
      else continue;                       // grupo do meio incompleto não vira coluna
      cols.push({tipo:"media", meses:fechados, rotulo:rot, forte:S.media==="Anual"});
    }
  });
  return cols;
}

const PE = {
  179: vc => { const mc = vc(4) ? vc(42)/vc(4) : 0;
               return mc ? -(vc(44)+vc(63))/mc : null; },
  180: vc => { const mc = vc(4) ? vc(42)/vc(4) : 0;
               return mc ? -(vc(44)+vc(63)+vc(141)+vc(163)+vc(169))/mc : null; },
  181: vc => { const p = vc(3) ? vc(6)/vc(3) : 0, b = PE[179](vc);
               return (p && b!==null) ? b*0.95/p : null; },
  182: vc => { const p = vc(3) ? vc(6)/vc(3) : 0, b = PE[180](vc);
               return (p && b!==null) ? b*0.95/p : null; }
};
function valorColBase(calc, linha, col){
  const vs = col.meses.map(m=>calc[m]?.[linha]).filter(v=>v!==null&&v!==undefined&&!isNaN(v));
  if(!vs.length) return null;
  if(col.tipo==="mes") return vs[0];
  const s = vs.reduce((a,b)=>a+b,0);
  return col.tipo==="media" ? s/vs.length : s;
}
function valorCol(calc, linha, col){
  if(PE[linha]) return PE[linha](n=>valorColBase(calc,n,col) || 0);
  return valorColBase(calc, linha, col);
}
function av(calc, linha, col){
  const b = valorCol(calc, LINHA_BASE, col);
  const v = valorCol(calc, linha, col);
  return (b && v!==null) ? v/b : null;
}

/* A cor diz melhorou ou piorou, não mais ou menos. No nominal quem decide é o
   sinal do valor: despesa vive negativa no DRE, então crescer aparece como +% e
   tem que sair vermelho. Em pontos a conta já sai orientada. */
function ah(calc, linha, cols, i, emPP){
  const tipo = cols[i].tipo;
  let ant = null;
  for(let k=i-1;k>=0;k--) if(cols[k].tipo===tipo){ ant=cols[k]; break; }
  if(!ant) return ["",""];
  if(emPP){
    const a = av(calc,linha,ant), b = av(calc,linha,cols[i]);
    if(!a && !b) return ["",""];
    const d = (b||0)-(a||0);
    return [fmtPP(d), Math.abs(d)<0.00005 ? "" : (d>0?"sobe":"desce")];
  }
  const base = valorCol(calc,linha,ant), atual = valorCol(calc,linha,cols[i]);
  if(base===null || atual===null || Math.abs(base)<0.5) return ["",""];
  const h = atual/base - 1;
  return [fmtVar(h), Math.abs(h)<0.00005 ? "" : ((h>0)===(base>0) ? "sobe":"desce")];
}
const fmtPct = v => v===null||isNaN(v) ? "" : (v*100).toFixed(1).replace(".",",")+"%";
const fmtPP  = v => (Math.abs(v)<0.00005?"0,0":(v*100>=0?"+":"")+(v*100).toFixed(1))
                    .replace(".",",")+"pp";
function fmtVar(v){
  if(v===null||isNaN(v)) return "";
  if(Math.abs(v)>9.99) return v>0 ? "↑" : "↓";
  if(Math.abs(v)<0.00005) return "0,0%";
  return ((v*100>=0?"+":"")+(v*100).toFixed(1)).replace(".",",")+"%";
}

/* pais: de quem cada linha desce — por soma (parcelas) ou por detalhe (pai) */
const ehResultado = it => /^\(=\)/.test(String(it?.rotulo||""));

/* De quem cada linha desce. As linhas de resultado somam grupos que JA estao
   na tela acima delas -- trata-las como pai fazia abrir a tabela inteira de
   novo, em duplicata. Elas so tem os filhos pendurados por `pai` (o analitico
   do Resultado Economico: CF e os pontos de equilibrio). */
function mapaPais(){
  const pais = {};
  S.estrutura.forEach(it=>{
    // Nem linha de resultado nem linha auxiliar (CF, pontos de equilibrio)
    // adotam filhos pela soma: a CF soma C44+C63, que ja estao na tela, e
    // recolher o Resultado Economico levava 91 linhas junto.
    const auxiliar = it.config?.pai != null;
    if(!ehResultado(it) && !auxiliar)
      (it.config?.parcelas||[]).forEach(p=>{ if(pais[p]===undefined) pais[p]=it.linha; });
    if(auxiliar) pais[it.linha] = it.config.pai;
  });
  return pais;
}
function linhasPP(pais){
  const alvo = new Set(S.estrutura
    .filter(i=>BLOCOS_PP.some(b=>String(i.rotulo||"").toUpperCase().includes(b)))
    .map(i=>i.linha));
  const out = new Set(alvo);
  S.estrutura.forEach(i=>{
    let p = pais[i.linha];
    const visto = new Set();
    while(p!=null && !visto.has(p)){ visto.add(p); if(alvo.has(p)){ out.add(i.linha); break; } p = pais[p]; }
  });
  return out;
}

function renderDre(){
  const ms = mesesVisiveis();
  const calc = {}; ms.forEach(m=>calc[m]=calcular(m));
  const cols = montarColunas(ms);
  const pais = mapaPais(), pp = linhasPP(pais);
  const nivelMax = S.nivel;

  // As linhas de detalhe vivem numa faixa própria (2000+) e viriam todas no fim
  // se ordenadas por número. Cada uma volta para baixo do seu pai.
  const filhos = {};
  S.estrutura.forEach(i=>{ const p=i.config?.pai; if(p!=null) (filhos[p]=filhos[p]||[]).push(i); });
  const ordenada = [];
  S.estrutura.forEach(i=>{
    if(i.config?.pai!=null) return;
    ordenada.push(i);
    (filhos[i.linha]||[]).forEach(f=>ordenada.push(f));
  });

  const notasPor = {};
  S.notas.forEach(n=>{ if(n.linha) (notasPor[n.linha+"|"+n.mes]=notasPor[n.linha+"|"+n.mes]||[]).push(n); });

  // Um ancestral aberto na mão vence o nível global: dá para abrir uma conta
  // sem ter de destravar a tabela inteira.
  const abertoAcima = ln => {
    let p = pais[ln]; const visto = new Set();
    while(p!=null && !visto.has(p)){ visto.add(p); if(S.abertos.has(p)) return true; p = pais[p]; }
    return false;
  };
  const recolhidoAcima = ln => {
    let p = pais[ln]; const visto = new Set();
    while(p!=null && !visto.has(p)){ visto.add(p); if(S.colapsados.has(p)) return true; p = pais[p]; }
    return false;
  };

  const nCol = cols.length * (1 + (S.av?1:0) + (S.ah?1:0));
  let h = "<thead><tr><th rowspan='3'>Conta"
          + "<div class='reg-rot'>Litros vendidos</div></th>";
  cols.forEach(c=>{
    const n = 1 + (S.av?1:0) + (S.ah?1:0);
    h += "<th colspan='"+n+"' class='ini"+(c.tipo==="media"?" mediaCol":"")+"'>"+c.rotulo+"</th>";
  });
  h += "</tr><tr>";
  cols.forEach(c=>{
    const cl = c.tipo==="media" ? " sub mediaCol" : " sub";
    h += "<th class='"+cl+" ini'>R$</th>";
    if(S.av) h += "<th class='"+cl+"'>AV</th>";
    if(S.ah) h += "<th class='"+cl+"'>AH</th>";
  });
  h += "</tr>";
  const nSub = 1 + (S.av?1:0) + (S.ah?1:0);
  let litros = "<tr class='regua'>";
  cols.forEach(c=>{
    const v = valorCol(calc, 3, c);
    litros += "<th colspan='"+nSub+"' class='ini"+(c.tipo==="media"?" mediaCol":"")+"'>"+
              (v ? fmt(v) : "—")+"</th>";
  });
  h += litros + "</tr></thead><tbody>";

  for(const it of ordenada){
    if(it.oculta && !it.rotulo){ h += '<tr class="vazia"><td colspan="'+(nCol+1)+'"></td></tr>'; continue; }
    if(recolhidoAcima(it.linha)) continue;
    const niv = it.nivel||0;
    if(niv > nivelMax && !abertoAcima(it.linha)) continue;
    if(it.tipo==="info" && cols.every(c=>!valorCol(calc,it.linha,c))) continue;

    const rot = String(it.rotulo||"");
    const total = /^\(=\)/.test(rot), grupo = /^\([+\-]\)/.test(rot);
    let cls = total ? "kpi" : (niv===0 && grupo ? "n0" : (niv<=1 && it.tipo==="grupo" ? "n1" : ""));
    if(it.tipo==="info") cls = "det";
    if(it.linha === LINHA_BASE) cls += " fixa";   // a ROB acompanha a rolagem

    const soAnalitico = (filhos[it.linha]||[]).map(f=>f.linha);
    const meusFilhos = ehResultado(it) ? soAnalitico
                     : [...(it.config?.parcelas||[]), ...soAnalitico];
    const temEscondido = meusFilhos.some(f=>{
      const fi = S.estrutura.find(x=>x.linha===f);
      return fi && (fi.nivel||0) > nivelMax;
    });
    let caret = '<span class="caret"></span>';
    if(meusFilhos.length){
      const fechado = S.colapsados.has(it.linha) ||
                      (temEscondido && !S.abertos.has(it.linha));
      caret = '<span class="caret'+(temEscondido&&!S.abertos.has(it.linha)?" mais":"")+
              '" data-ln="'+it.linha+'">'+(fechado?"▸":"▾")+'</span>';
    }
    const aj = it.config?.ajuda ? ' title="'+it.config.ajuda.replace(/"/g,"&quot;")+'"' : '';
    h += '<tr class="'+cls+'"><td style="padding-left:'+(10+niv*15)+'px"'+aj+'>'+caret+
         '<span class="rot">'+rot+'</span></td>';

    cols.forEach((c,ci)=>{
      const v = valorCol(calc, it.linha, c);
      const ed = c.tipo==="mes" ? S.edicoes[it.linha+"|"+c.meses[0]] : null;
      const nt = c.tipo==="mes" ? notasPor[it.linha+"|"+c.meses[0]] : null;
      const cm = c.tipo==="media" ? " mediaCol" : "";
      let td = '<td class="ini '+(ed?"man ":"")+(S.admin&&c.tipo==="mes"?"edit ":"")+
               (v<0?"neg":"")+cm+'"';
      if(c.tipo==="mes") td += ' data-ln="'+it.linha+'" data-mes="'+c.meses[0]+'"';
      if(ed) td += ' title="'+(ed.motivo||"editado").replace(/"/g,"&quot;")+' — '+(ed.autor||"?")+'"';
      td += '>'+fmt(v)+(nt?'<span class="temnota" title="'+
            nt.map(x=>x.texto.replace(/"/g,"&quot;")).join(" | ")+'">●</span>':'')+'</td>';
      h += td;
      if(S.av) h += '<td class="col-av'+cm+'">'+(v===null||Math.abs(v)<0.5?"":fmtPct(av(calc,it.linha,c)))+'</td>';
      if(S.ah){
        const [t,cor] = ah(calc, it.linha, cols, ci, pp.has(it.linha));
        h += '<td class="col-ah '+cor+cm+'">'+t+'</td>';
      }
    });
    h += '</tr>';
  }
  document.getElementById("t-dre").innerHTML = h + "</tbody>";
  // As alturas reais so existem depois de montar; sem isso as tres linhas do
  // cabecalho congelavam todas em top:0 e uma cobria a outra.
  // Duas passadas: a celula "Conta" tem rowspan 3 e pode esticar as linhas do
  // cabecalho, entao a altura so e confiavel depois que o layout assenta. Medir
  // cedo deixava uma faixa onde as linhas do corpo apareciam por tras da ROB.
  const medir = ()=>{
    const t = document.getElementById("t-dre"); if(!t?.tHead) return;
    const alt = i => t.tHead.rows[i] ? t.tHead.rows[i].getBoundingClientRect().height : 0;
    const h1 = alt(0), h2 = alt(1), st = t.style;
    st.setProperty("--t1","0px");
    st.setProperty("--t2", Math.round(h1)+"px");
    st.setProperty("--t3", Math.round(h1+h2)+"px");
    // a ROB encosta no fim do cabecalho inteiro, nao na soma das partes
    st.setProperty("--t4", Math.round(t.tHead.getBoundingClientRect().height)+"px");
  };
  requestAnimationFrame(()=>{ medir(); requestAnimationFrame(medir); });

  document.querySelectorAll(".caret[data-ln]").forEach(c=>c.onclick=e=>{
    const ln = +e.target.dataset.ln;
    if(e.target.classList.contains("mais")){ S.abertos.add(ln); S.colapsados.delete(ln); }
    else if(S.colapsados.has(ln)){ S.colapsados.delete(ln); }
    else { S.colapsados.add(ln); S.abertos.delete(ln); }
    renderDre();
  });
  if(S.admin) document.querySelectorAll("td.edit").forEach(td=>td.ondblclick=()=>
    abrirEdicao(+td.dataset.ln, td.dataset.mes));

  document.getElementById("dica").textContent = S.admin
    ? "duplo clique numa célula para editar · ▸ abre a linha sozinha" : "somente leitura";
  renderKpis(calc, ms);
}

function renderKpis(calc, ms){
  const achar = re => S.estrutura.find(i=>re.test(String(i.rotulo||"")));
  const alvos = [
    ["Receita líquida", achar(/^\(=\) RECEITA OPERACIONAL L/)],
    ["Resultado oper.", achar(/^\(=\) RESULTADO OPERACIONAL/)],
    ["EBITDA",          achar(/^\(=\) EBITDA/)],
    ["Resultado econ.", achar(/^\(=\) RESULTADO ECON/)]
  ];
  document.getElementById("kpis").innerHTML = alvos.map(([rot,it])=>{
    if(!it) return "";
    let s=0,n=0; ms.forEach(m=>{const v=calc[m][it.linha]; if(v||v===0){s+=v;n++;}});
    return '<div class="card"><div class="rot">'+rot+'</div><div class="val'+
      (s<0?" neg":"")+'">'+fmt(s)+'</div></div>';
  }).join("");
}

function abrirEdicao(linha, mes){

/* ===================== notas =====================
   Uma tabela so, com tudo que interferiu no DRE: as EDICOES (que mudaram
   numero, com De/Para) e as NOTAS (que so explicam). Separadas em duas telas,
   quem abria "notas" nao via os ajustes que de fato moveram o resultado --
   justamente os que precisam de explicacao.                               */
function valorAntes(linha, mes){          // o que a linha diria sem a edicao
  return calcular(mes, linha)[linha];
}

function linhasDoRegistro(){
  const rot = {}; S.estrutura.forEach(i=>rot[i.linha]=i.rotulo);
  const itens = [];
  for(const k in S.edicoes){
    const e = S.edicoes[k];
    itens.push({tipo:"edicao", id:e.linha+"|"+e.mes, autor:e.autor, mes:e.mes,
                de:valorAntes(e.linha, e.mes), para:+e.valor,
                linha:e.linha, conta:rot[e.linha]||("linha "+e.linha),
                texto:e.motivo||"", quando:e.quando});
  }
  for(const n of S.notas){
    itens.push({tipo:"nota", id:n.id, autor:n.autor, mes:n.mes,
                de:null, para:null, linha:n.linha,
                conta:n.linha?(rot[n.linha]||("linha "+n.linha)):null,
                texto:n.texto, quando:n.quando});
  }
  return itens.sort((a,b)=> new Date(b.quando||0) - new Date(a.quando||0));
}

function renderNotas(){
  document.getElementById("nova-nota").classList.toggle("oculto", !S.admin);
  const itens = linhasDoRegistro();
  const el = document.getElementById("l-notas");
  if(!itens.length){
    el.innerHTML = '<div class="vazio">Nenhum ajuste ou nota ainda.</div>';
    return;
  }
  let h = `<table id="t-notas"><thead><tr>
    <th>Usuário</th><th>Mês</th><th class="num">De</th><th class="num">Para</th>
    <th>Plano de contas</th><th>Comentário</th>${S.admin?"<th></th>":""}
    </tr></thead><tbody>`;
  for(const it of itens){
    const dif = (it.de!=null && it.para!=null) ? it.para-it.de : null;
    h += `<tr class="${it.tipo}">
      <td>${(it.autor||"—").replace(/@.*/,"")}<span class="dom">${
            (it.autor||"").includes("@")?"@"+it.autor.split("@")[1]:""}</span></td>
      <td>${it.mes?rotMes(it.mes):"—"}</td>
      <td class="num ${it.de<0?"neg":""}">${it.de!=null?fmt(it.de):""}</td>
      <td class="num forte ${it.para<0?"neg":""}">${it.para!=null?fmt(it.para):""}</td>
      <td>${it.conta||"—"}${dif!=null?`<span class="dif ${dif<0?"neg":""}">${
            dif>0?"+":""}${fmt(dif)}</span>`:""}</td>
      <td class="com">${it.texto||""}</td>
      ${S.admin?`<td class="num"><a href="#" data-tipo="${it.tipo}" data-id="${
            it.id}">remover</a></td>`:""}</tr>`;
  }
  el.innerHTML = h + "</tbody></table>";

  el.querySelectorAll("a[data-id]").forEach(a=>a.onclick=async e=>{
    e.preventDefault();
    if(a.dataset.tipo==="nota"){
      await sb("dre_notas?id=eq."+a.dataset.id,
               {method:"DELETE",headers:{Prefer:"return=minimal"}});
    }else{
      const [ln,mes] = a.dataset.id.split("|");
      if(!confirm("Remover o ajuste devolve a linha ao valor calculado. Confirma?")) return;
      await sb(`dre_edicoes?projeto=eq.${CONFIG.PROJETO}&linha=eq.${ln}&mes=eq.${mes}`,
               {method:"DELETE",headers:{Prefer:"return=minimal"}});
    }
    await carregar(); renderNotas();
  });
}

/* ===================== simulador de combustível =====================
   Diesel e gasolina sao 94% do faturamento (media de 9 meses, desvio 0,74%).
   Eles entram linha a linha, montados de baixo para cima. O resto -- etanol,
   arla, lubrificantes, conveniencia -- entra pela proporcao historica: se os
   dois sempre valeram X% do faturamento, o total e o deles dividido por X%, e
   a diferenca traz a margem dos demais na taxa que eles costumam dar.

   Isso importa na simulacao: quando o volume de combustivel sobe, a loja sobe
   junto. Tratar o resto como valor fixo subestimaria o ganho.              */

const SIM = { mes:null, campos:{}, alvo:"dsl", litros:null, cmv:null };
const PROD = { dsl:"Diesel", gas:"Gasolina" };

function mesCorrente(){
  const h = new Date();
  return h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0");
}
const mesAberto = m => m >= mesCorrente();
function mesesFechados(){ return S.meses.slice(); }

/* Numeros do mes, por litro de cada produto. Preco, desconto e CMV sao do
   proprio produto; imposto, cartao, deslocamento e comissao servem a todos os
   combustiveis, entao rateiam pelo litro de combustivel do mes.            */
function baseDoMes(mes){
  const f = S.fato[mes] || {}, c = calcular(mes);
  const qC = f["vnd:qtd_comb"] || 0;
  if(!qC) return null;
  const abs = n => Math.abs(c[n] || 0);
  const rateio = { imposto: abs(12)/qC, cartao: abs(20)/qC,
                   desloc: abs(31)/qC, comissao: abs(37)/qC };
  const out = { litrosComb:qC, rateio, prod:{},
                fatTotal: f["vnd:bruto_total"] || 0 };
  for(const p in PROD){
    const q = f[p+":qtd"] || 0;
    if(!q) return null;
    out.prod[p] = { litros:q, preco:(f[p+":bruto"]||0)/q,
                    desconto:(f[p+":desconto"]||0)/q, cmv:(f[p+":custo"]||0)/q,
                    ...rateio };
  }
  out.fatDG = (f["dsl:bruto"]||0) + (f["gas:bruto"]||0);
  out.pctDG = out.fatTotal ? out.fatDG/out.fatTotal : 0;
  out.mcTotal = c[42] || 0;
  return out;
}

const margemLitro = k => k.preco - k.desconto - k.imposto - k.cartao
                       - k.cmv - k.desloc - k.comissao;

const fixoDoMes = mes => {
  const c = calcular(mes);
  return Math.abs(c[44] || 0) + Math.abs(c[63] || 0);
};
function fixoMedio(mes, n = 3){
  const fech = S.meses.filter(m => !mesAberto(m));
  const i = fech.indexOf(mes);
  const janela = (i < 0 ? fech : fech.slice(0, i + 1)).slice(-n);
  if(!janela.length) return {valor:0, meses:[]};
  return {valor: janela.reduce((s,m)=> s + fixoDoMes(m), 0)/janela.length, meses:janela};
}

const num = v => (v===null||v===undefined||isNaN(v)) ? "" :
  v.toLocaleString("pt-BR",{minimumFractionDigits:4,maximumFractionDigits:4});
const int = v => (v===null||isNaN(v)) ? "" :
  Math.round(v).toLocaleString("pt-BR");

function renderSim(){
  const meses = mesesFechados();
  const el = document.getElementById("c-sim");
  if(!meses.length){ el.innerHTML='<div class="vazio">Sem meses na base.</div>'; return; }
  SIM.mes = SIM.mes && meses.includes(SIM.mes) ? SIM.mes : meses[meses.length-1];
  const b = baseDoMes(SIM.mes);
  if(!b){ el.innerHTML='<div class="vazio">Sem venda de combustível neste mês.</div>'; return; }

  if(SIM.campos._mes !== SIM.mes){
    SIM.campos = {_mes:SIM.mes};
    for(const p in PROD) SIM.campos[p] = {...b.prod[p]};
    SIM.litros = null; SIM.cmv = null;
  }
  const K = SIM.campos, fx = fixoMedio(SIM.mes);

  /* --- taxa de margem dos demais, do historico --- */
  const mcHistDG = Object.keys(PROD)
        .reduce((s,p)=> s + margemLitro(b.prod[p])*b.prod[p].litros, 0);
  const fatDemaisHist = b.fatTotal - b.fatDG;
  const mcDemaisHist  = b.mcTotal - mcHistDG;
  const taxaDemais = fatDemaisHist ? mcDemaisHist/fatDemaisHist : 0;

  /* --- situacao simulada --- */
  let fatDG = 0, mcDG = 0;
  const porProd = {};
  for(const p in PROD){
    const m = margemLitro(K[p]);
    porProd[p] = {mc:m, litros:K[p].litros, fat:K[p].preco*K[p].litros,
                  mcTotal:m*K[p].litros};
    fatDG += porProd[p].fat; mcDG += porProd[p].mcTotal;
  }
  const fatTotalSim = b.pctDG ? fatDG/b.pctDG : 0;
  const fatDemais   = fatTotalSim - fatDG;
  const mcDemais    = fatDemais * taxaDemais;
  const mcTudo      = mcDG + mcDemais;
  const resultado   = mcTudo - fx.valor;
  const fator       = mcTudo > 0 ? fx.valor/mcTudo : null;   // escala p/ empatar

  const linhaProd = (rot, chave, sinal, ajuda) => `
    <tr><td>${sinal||""} ${rot}${ajuda?`<span class="aj" title="${ajuda}">?</span>`:""}</td>
      ${Object.keys(PROD).map(p=>`<td class="num"><input type="text"
         data-p="${p}" data-k="${chave}" value="${num(K[p][chave])}"></td>`).join("")}</tr>`;

  el.innerHTML = `
    <div class="barra">
      <label>Mês base <select id="s-mes">${meses.map(m=>
        `<option value="${m}" ${m===SIM.mes?"selected":""}>${rotMes(m)}</option>`).join("")}</select></label>
      <span style="font-size:12px;color:var(--text-muted)">
        diesel + gasolina = ${(b.pctDG*100).toFixed(1)}% do faturamento deste mês</span>
      <button class="btn sec" id="s-reset">voltar ao histórico</button>
    </div>

    <div class="sim-grid">
      <div class="sim-cx" style="grid-column:span 2">
        <h3>Composição por litro</h3>
        <div class="sub">vem do mês escolhido — mude qualquer número para simular</div>
        <table class="sim dois">
          <tr class="cab"><td></td>${Object.values(PROD).map(n=>
            `<td class="num"><b>${n}</b></td>`).join("")}</tr>
          <tr><td>Litros vendidos</td>${Object.keys(PROD).map(p=>
            `<td class="num"><input type="text" data-p="${p}" data-k="litros"
               value="${int(K[p].litros)}"></td>`).join("")}</tr>
          ${linhaProd("Preço de venda bruto","preco","")}
          ${linhaProd("Desconto","desconto","(−)")}
          ${linhaProd("Impostos sobre faturamento","imposto","(−)","linha 12 do DRE rateada pelos litros de combustível")}
          ${linhaProd("Taxa de cartão","cartao","(−)","linha 20 do DRE rateada")}
          ${linhaProd("CMV (preço de compra)","cmv","(−)")}
          ${linhaProd("Desloc. de produtos","desloc","(−)","linha 31 rateada")}
          ${linhaProd("Comissões e incentivos","comissao","(−)","linha 37 rateada")}
          <tr class="tot"><td>(=) Margem por litro</td>${Object.keys(PROD).map(p=>
            `<td class="num">${num(porProd[p].mc)}</td>`).join("")}</tr>
          <tr class="sub-t"><td>Margem do mês</td>${Object.keys(PROD).map(p=>
            `<td class="num">${fmt(porProd[p].mcTotal)}</td>`).join("")}</tr>
        </table>
      </div>

      <div class="sim-cx">
        <h3>Resultado do mês</h3>
        <div class="sub">custo fixo médio de ${fx.meses.map(rotMes).join(", ")}</div>
        <table class="sim">
          <tr><td>Margem diesel + gasolina</td><td class="num">${fmt(mcDG)}</td></tr>
          <tr><td>Faturamento dos dois</td><td class="num">${fmt(fatDG)}</td></tr>
          <tr><td>÷ ${(b.pctDG*100).toFixed(1)}% = faturamento total
              <span class="aj" title="proporção histórica deste mês: se os dois sempre valem essa fatia, o total sai por regra de três">?</span></td>
              <td class="num">${fmt(fatTotalSim)}</td></tr>
          <tr><td>Faturamento dos demais</td><td class="num">${fmt(fatDemais)}</td></tr>
          <tr><td>× margem de ${(taxaDemais*100).toFixed(1)}%
              <span class="aj" title="margem que etanol, arla, lubrificantes e conveniência deram neste mês">?</span></td>
              <td class="num">${fmt(mcDemais)}</td></tr>
          <tr class="sub-t"><td>(=) Margem total</td><td class="num"><b>${fmt(mcTudo)}</b></td></tr>
          <tr><td>(−) Custo + despesa fixa</td><td class="num">${fmt(fx.valor)}</td></tr>
          <tr class="tot ${resultado>=0?"bom":""}"><td>(=) Resultado</td>
              <td class="num">${fmt(resultado)}</td></tr>
        </table>
      </div>

      <div class="sim-cx">
        <h3>Quanto falta vender</h3>
        <div class="sub">mantendo a mistura atual entre os dois</div>
        <table class="sim">
          ${Object.keys(PROD).map(p=>`
          <tr><td>${PROD[p]} — vendido</td><td class="num">${int(K[p].litros)} L</td></tr>
          <tr><td>${PROD[p]} — para empatar</td>
              <td class="num"><b>${fator!==null?int(K[p].litros*fator):"—"} L</b></td></tr>`).join("")}
          <tr class="tot ${fator!==null&&fator<=1?"bom":""}">
            <td>${fator!==null&&fator<=1?"Sobra sobre o equilíbrio":"Faltam vender"}</td>
            <td class="num">${fator!==null
              ? int(Math.abs(Object.keys(PROD).reduce((s,p)=>s+K[p].litros*(fator-1),0)))+" L"
              : "—"}</td></tr>
        </table>
        ${mcTudo<=0?'<div class="aviso" style="margin-top:12px">Margem total negativa: não existe ponto de equilíbrio — vender mais aumenta o prejuízo.</div>':""}
        ${mesAberto(SIM.mes)?`<div class="sim-nota" style="color:var(--amber)">
          <b>${rotMes(SIM.mes)} ainda está em curso.</b> Litros e margem são
          parciais, mas o custo fixo é de um mês inteiro — isto responde quanto
          ainda falta vender até fechar o mês.</div>`:""}
      </div>

      <div class="sim-cx destaque" style="grid-column:span 2">
        <h3>Caminho inverso</h3>
        <div class="sub">tenho este custo e quero vender esta litragem — a que preço?</div>
        <table class="sim">
          <tr><td>Produto</td><td class="num">
            <select id="s-alvo">${Object.keys(PROD).map(p=>
              `<option value="${p}" ${p===SIM.alvo?"selected":""}>${PROD[p]}</option>`).join("")}</select>
          </td></tr>
          <tr><td>Preço de compra (CMV/L)</td><td class="num">
            <input type="text" id="s-cmv" value="${num(SIM.cmv!==null?SIM.cmv:K[SIM.alvo].cmv)}"></td></tr>
          <tr><td>Litragem pretendida (L)</td><td class="num">
            <input type="text" id="s-litros" value="${int(SIM.litros!==null?SIM.litros:K[SIM.alvo].litros)}"></td></tr>
        </table>
        <div id="s-resp"></div>
      </div>
    </div>

    <div class="aviso" style="margin-top:16px">
      <b>Imposto quase zerado por litro não é erro.</b> Combustível é
      <b>monofásico</b>: o ICMS/PIS/COFINS já está dentro do preço de compra, não
      é debitado na venda. O que entra aqui como imposto é a linha do DRE
      rateada — mexer no CMV já mexe no tributo embutido.
      <br><br><b>O resto do negócio acompanha o volume.</b> Etanol, arla,
      lubrificantes e conveniência entram pela proporção histórica
      (diesel + gasolina = ${(b.pctDG*100).toFixed(1)}% do faturamento neste mês,
      média de 94,1% no ano com desvio de 0,7%). Se você simular mais volume, a
      loja cresce junto — tratá-la como valor fixo subestimaria o ganho.
    </div>`;

  // --- caminho inverso, calculado sobre o produto escolhido ---
  const k = K[SIM.alvo];
  const cmvSim = SIM.cmv !== null ? SIM.cmv : k.cmv;
  const litrosSim = SIM.litros !== null ? SIM.litros : k.litros;
  const outro = Object.keys(PROD).find(p => p !== SIM.alvo);
  // o outro produto e os demais seguem como estao; sobra para este pagar o resto
  const mcOutro = porProd[outro].mcTotal;
  const fatOutro = porProd[outro].fat;
  const variaveis = k.desconto + k.imposto + k.cartao + k.desloc + k.comissao;
  // preco tal que: mc(este) + mc(outro) + mc(demais) = custo fixo
  // mc(demais) depende do faturamento total, que depende do preco -> resolve direto
  const a = b.pctDG ? (1/b.pctDG - 1) * taxaDemais : 0;   // margem demais por R$ de D+G
  const precoNec = litrosSim > 0
    ? (fx.valor - mcOutro - fatOutro*a + litrosSim*(cmvSim + variaveis)) /
      (litrosSim * (1 + a))
    : null;
  document.getElementById("s-resp").innerHTML = `
    <table class="sim" style="margin-top:2px">
      <tr><td>Demais custos por litro</td><td class="num">${num(variaveis)}</td></tr>
      <tr><td>Margem que ${PROD[outro].toLowerCase()} e a loja já trazem</td>
          <td class="num">${fmt(mcOutro + fatOutro*a)}</td></tr>
      <tr class="tot grande"><td>Preço de venda necessário</td>
          <td class="num">${precoNec!==null?num(precoNec):"—"}</td></tr>
    </table>
    <div class="sim-nota">Preço que zera o resultado do mês inteiro, já contando
      o que ${PROD[outro].toLowerCase()} e o resto da loja contribuem.
      ${precoNec!==null?`Hoje o praticado é <b>${num(b.prod[SIM.alvo].preco)}</b>
      — diferença de <b>${num(precoNec-b.prod[SIM.alvo].preco)}</b> por litro.`:""}</div>`;

  const ler = t => parseFloat(String(t).replace(/\./g,"").replace(",",".")) || 0;
  document.getElementById("s-mes").onchange = e => { SIM.mes=e.target.value; renderSim(); };
  document.getElementById("s-reset").onclick = () => { SIM.campos={}; SIM.cmv=null; SIM.litros=null; renderSim(); };
  document.getElementById("s-alvo").onchange = e => { SIM.alvo=e.target.value; SIM.cmv=null; SIM.litros=null; renderSim(); };
  document.getElementById("s-cmv").onchange = e => { SIM.cmv=ler(e.target.value); renderSim(); };
  document.getElementById("s-litros").onchange = e => { SIM.litros=Math.max(1,Math.round(ler(e.target.value))); renderSim(); };
  document.querySelectorAll("#c-sim input[data-p]").forEach(i=>{
    i.onchange = () => {
      const v = ler(i.value);
      SIM.campos[i.dataset.p][i.dataset.k] = i.dataset.k==="litros" ? Math.max(0,Math.round(v)) : v;
      renderSim();
    };
  });
}


/* ===================== exportar para Excel =====================
   A base bruta (234 mil linhas) nunca vem para o navegador -- e por isso que a
   tela abre instantanea. O que da para exportar e o que o app TEM: o DRE como
   esta na tela, os agregados que o alimentam, o mapeamento de contas e o
   registro de ajustes. A biblioteca so e baixada no clique.            */
let _xlsxCarregado = null;
function carregarXLSX(){
  if(_xlsxCarregado) return _xlsxCarregado;
  _xlsxCarregado = new Promise((ok, erro)=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ()=> ok(window.XLSX);
    s.onerror = ()=> erro(new Error("não consegui baixar a biblioteca de Excel"));
    document.head.appendChild(s);
  });
  return _xlsxCarregado;
}

async function exportarXLSX(){
  const XLSX = await carregarXLSX();
  const wb = XLSX.utils.book_new();
  const rot = {}; S.estrutura.forEach(i=>rot[i.linha]=i.rotulo);

  /* --- 1. o DRE como esta na tela --- */
  const ms = mesesVisiveis();
  const calc = {}; ms.forEach(m=>calc[m]=calcular(m));
  const cols = montarColunas(ms);
  const cab = ["Linha","Conta","Nível"];
  cols.forEach(c=>{ cab.push(c.rotulo); if(S.av) cab.push(c.rotulo+" AV"); });
  const dre = [cab];
  for(const it of S.estrutura){
    if(!it.rotulo) continue;
    const l = [it.linha, it.rotulo, it.nivel||0];
    cols.forEach(c=>{
      const v = valorCol(calc, it.linha, c);
      l.push(v===null||v===undefined||isNaN(v) ? null : +v.toFixed(2));
      if(S.av){ const a = av(calc, it.linha, c); l.push(a===null?null:+(a*100).toFixed(1)); }
    });
    dre.push(l);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dre), "DRE");

  /* --- 2. os agregados que alimentam tudo --- */
  const base = [["Mês","Chave","Valor"]];
  Object.keys(S.fato).sort().forEach(m=>
    Object.keys(S.fato[m]).sort().forEach(k=>
      base.push([m, k, +(+S.fato[m][k]).toFixed(2)])));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(base), "Base agregada");

  /* --- 3. mapeamento de contas --- */
  const ct = [["Conta","Linha do DRE","Situação","Motivo"]];
  S.contas.forEach(c=> ct.push([c.conta, c.linha ? rot[c.linha]||c.linha : "",
    c.fora ? "fora do DRE" : (c.linha ? "classificada" : "SEM LINHA"), c.motivo||""]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ct), "Contas");

  /* --- 4. registro de ajustes e notas --- */
  const aj = [["Usuário","Mês","De","Para","Plano de contas","Comentário","Quando"]];
  linhasDoRegistro().forEach(i=> aj.push([i.autor||"", i.mes?rotMes(i.mes):"",
    i.de==null?null:+i.de.toFixed(2), i.para==null?null:+i.para.toFixed(2),
    i.conta||"", i.texto||"", i.quando?new Date(i.quando).toLocaleString("pt-BR"):""]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aj), "Ajustes e notas");

  const hoje = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `DRE Cotraoeste ${hoje}.xlsx`);
}

    await iniciar();
  }catch(err){ e.textContent = String(err.message||err); }
};
document.getElementById("lg-senha").onkeydown = ev =>
  { if(ev.key==="Enter") document.getElementById("lg-entrar").click(); };

document.getElementById("sair").onclick = ()=>{
  localStorage.removeItem("dre_sessao"); location.reload();
};

(async ()=>{
  const g = localStorage.getItem("dre_sessao");
  if(!g) return;
  try{
    S.sessao = JSON.parse(g);
    const adm = await sb("dre_admins?select=email&email=eq."+
                         encodeURIComponent(S.sessao.user.email));
    S.admin = !!adm?.length;
    document.getElementById("login").classList.add("oculto");
    await iniciar();
  }catch(_){ localStorage.removeItem("dre_sessao"); }
})();
</script>
